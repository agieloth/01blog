<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">Student<span>Hub</span></div>
    <div class="auth-tagline">La plateforme des étudiants</div>

    <div class="auth-title">Connexion</div>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <div class="form-group">
      <label>Email ou nom d'utilisateur</label>
      <input type="text" [(ngModel)]="identifier" placeholder="john@example.com ou johndoe"
        (keydown)="onKey($event)" autocomplete="username" />
    </div>

    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••"
        (keydown)="onKey($event)" autocomplete="current-password" />
    </div>

    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px"
      (click)="submit()" [disabled]="loading">
      {{ loading ? 'Connexion…' : 'Se connecter' }}
    </button>

    <div class="auth-footer">
      Pas encore de compte ? <a routerLink="/register">S'inscrire</a>
    </div>
  </div>
</div>
