<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">Student<span>Hub</span></div>
    <div class="auth-tagline">Rejoins la communauté</div>

    <div class="auth-title">Créer un compte</div>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <div class="form-group">
      <label>Nom d'utilisateur</label>
      <input type="text" [(ngModel)]="username" placeholder="mon_pseudo" autocomplete="username" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="moi@example.com" autocomplete="email" />
    </div>

    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" [(ngModel)]="password" placeholder="Min. 6 caractères" autocomplete="new-password" />
    </div>

    <div class="form-group">
      <label>Confirmer le mot de passe</label>
      <input type="password" [(ngModel)]="confirmPassword" placeholder="••••••••"
        autocomplete="new-password" (keydown.enter)="submit()" />
    </div>

    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px"
      (click)="submit()" [disabled]="loading">
      {{ loading ? 'Création…' : 'Créer mon compte' }}
    </button>

    <div class="auth-footer">
      Déjà un compte ? <a routerLink="/login">Se connecter</a>
    </div>
  </div>
</div>
