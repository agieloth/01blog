<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0b0d11;
        --surface: #13161d;
        --surface2: #1a1e28;
        --border: #1e2330;
        --border2: #2a3045;
        --accent: #5c6fff;
        --accent2: #a78bfa;
        --accent-light: rgba(92, 111, 255, 0.12);
        --accent-hover: #4a5be8;
        --success: #34d399;
        --success-bg: rgba(52, 211, 153, 0.1);
        --error: #f87171;
        --error-bg: rgba(248, 113, 113, 0.1);
        --text: #e8eaf0;
        --text2: #9ca3b0;
        --muted: #6b7280;
        --font-head: "Syne", sans-serif;
        --font-body: "DM Sans", sans-serif;
        --radius: 14px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.6);
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.6;
        min-height: 100vh;
      }

      /* ── NOISE OVERLAY ── */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
      }

      /* ── GRADIENT BLOBS ── */
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.1;
        pointer-events: none;
        z-index: 0;
      }
      .blob-1 {
        width: 600px;
        height: 600px;
        background: var(--accent);
        top: -200px;
        left: -200px;
      }
      .blob-2 {
        width: 400px;
        height: 400px;
        background: var(--accent2);
        bottom: -100px;
        right: -100px;
      }

      /* ── UTILITIES ── */
      .hidden {
        display: none !important;
      }
      .fade-in {
        animation: fadeIn 0.35s ease both;
      }
      .slide-up {
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── SPINNER ── */
      .spinner {
        display: inline-block;
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.55s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── AUTH PAGE ── */
      #auth-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        position: relative;
        z-index: 1;
      }

      .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px;
        box-shadow: var(--shadow);
        animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .auth-logo {
        font-family: var(--font-head);
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin-bottom: 28px;
      }
      .auth-logo span {
        color: var(--accent);
      }
      .auth-title {
        font-family: var(--font-head);
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 6px;
      }
      .auth-sub {
        color: var(--muted);
        font-size: 0.88rem;
        margin-bottom: 28px;
      }

      /* ── TABS ── */
      .tabs {
        display: flex;
        gap: 4px;
        background: var(--bg);
        border-radius: 10px;
        padding: 4px;
        margin-bottom: 28px;
      }
      .tab-btn {
        flex: 1;
        padding: 9px;
        border: none;
        background: none;
        color: var(--muted);
        font-family: var(--font-body);
        font-size: 0.88rem;
        font-weight: 500;
        border-radius: 7px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .tab-btn.active {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }

      /* ── FORM ── */
      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 0.76rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 7px;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"],
      textarea {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 11px 14px;
        color: var(--text);
        font-family: var(--font-body);
        font-size: 0.92rem;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        resize: vertical;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--muted);
        opacity: 0.5;
      }
      input:focus,
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(92, 111, 255, 0.15);
      }

      /* ── BUTTONS ── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 11px 20px;
        border: none;
        border-radius: 9px;
        font-family: var(--font-head);
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        letter-spacing: 0.01em;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
        width: 100%;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(92, 111, 255, 0.35);
      }
      .btn-primary:active {
        transform: translateY(0);
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      .btn-ghost {
        background: none;
        color: var(--text2);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        border-color: var(--border2);
        background: var(--surface2);
      }
      .btn-danger {
        background: none;
        color: var(--error);
        border: 1px solid transparent;
      }
      .btn-danger:hover {
        background: var(--error-bg);
        border-color: rgba(248, 113, 113, 0.3);
      }
      .btn-sm {
        padding: 7px 14px;
        font-size: 0.8rem;
        border-radius: 7px;
      }

      /* ── ALERTS ── */
      .alert {
        padding: 11px 14px;
        border-radius: 9px;
        font-size: 0.84rem;
        margin-top: 14px;
        display: none;
      }
      .alert.show {
        display: block;
        animation: fadeIn 0.25s ease;
      }
      .alert-success {
        background: var(--success-bg);
        border: 1px solid rgba(52, 211, 153, 0.25);
        color: var(--success);
      }
      .alert-error {
        background: var(--error-bg);
        border: 1px solid rgba(248, 113, 113, 0.25);
        color: var(--error);
      }

      /* ── APP LAYOUT ── */
      #app-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 1;
      }

      /* ── NAVBAR ── */
      .navbar {
        background: rgba(11, 13, 17, 0.8);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 0 40px;
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .navbar-brand {
        font-family: var(--font-head);
        font-size: 1.3rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .navbar-brand span {
        color: var(--accent);
      }
      .navbar-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .navbar-user {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .navbar-avatar {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
        font-family: var(--font-head);
        font-size: 0.95rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .navbar-username {
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text);
      }

      /* ── MAIN ── */
      .app-body {
        flex: 1;
        max-width: 740px;
        width: 100%;
        margin: 0 auto;
        padding: 44px 24px;
      }

      /* ── SECTION HEADER ── */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
      }
      .section-title {
        font-family: var(--font-head);
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .section-count {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 3px;
      }

      /* ── CREATE PROMPT ── */
      .create-prompt {
        background: var(--surface);
        border: 1px dashed var(--border2);
        border-radius: var(--radius);
        padding: 17px 22px;
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .create-prompt:hover {
        border-color: var(--accent);
        background: var(--accent-light);
      }
      .create-prompt-avatar {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: var(--surface2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-head);
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--muted);
        flex-shrink: 0;
      }
      .create-prompt-text {
        color: var(--muted);
        font-size: 0.88rem;
      }

      /* ── POST FORM ── */
      .post-form-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        margin-bottom: 24px;
        box-shadow: var(--shadow);
        animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .post-form-label {
        font-family: var(--font-head);
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      #post-title-input {
        font-size: 1rem;
        font-weight: 200;
        letter-spacing: -0.01em;
      }
      #post-content-input {
        min-height: 110px;
        font-size: 0.9rem;
        line-height: 1.7;
      }
      .post-form-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 16px;
      }

      /* ── POST CARD ── */
      .post-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 26px 28px;
        margin-bottom: 14px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .post-card:hover {
        border-color: var(--border2);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      }

      .post-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .post-meta {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .post-avatar {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--surface2);
        color: var(--muted);
        font-family: var(--font-head);
        font-size: 0.85rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .post-avatar.own {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
      }
      .post-author {
        font-size: 0.84rem;
        font-weight: 600;
      }
      .post-date {
        font-size: 0.74rem;
        color: var(--muted);
      }
      .own-badge {
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: var(--accent-light);
        color: var(--accent);
        padding: 2px 8px;
        border-radius: 4px;
        margin-left: 6px;
        border: 1px solid rgba(92, 111, 255, 0.25);
      }
      .post-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .post-card:hover .post-actions {
        opacity: 1;
      }

      .post-title {
        font-family: var(--font-head);
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.35;
        margin-bottom: 10px;
        cursor: pointer;
        transition: color 0.2s;
      }
      .post-title:hover {
        color: var(--accent);
      }
      .post-preview {
        color: var(--text2);
        font-size: 0.88rem;
        line-height: 1.75;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .post-full {
        color: var(--text2);
        font-size: 0.88rem;
        line-height: 1.75;
        white-space: pre-wrap;
      }

      .post-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }
      .read-more {
        background: none;
        border: none;
        color: var(--accent);
        font-family: var(--font-body);
        font-size: 0.79rem;
        font-weight: 600;
        cursor: pointer;
        padding: 0;
        transition: opacity 0.2s;
      }
      .read-more:hover {
        opacity: 0.7;
      }
      .post-id {
        font-size: 0.72rem;
        color: var(--muted);
      }

      /* ── EMPTY STATE ── */
      .empty-state {
        text-align: center;
        padding: 80px 24px;
        color: var(--muted);
      }
      .empty-icon {
        font-size: 2.8rem;
        margin-bottom: 14px;
      }
      .empty-title {
        font-family: var(--font-head);
        font-size: 1.2rem;
        color: var(--text2);
        margin-bottom: 8px;
      }
      .empty-text {
        font-size: 0.85rem;
        line-height: 1.6;
      }

      /* ── LOADING ── */
      .posts-loading {
        display: flex;
        justify-content: center;
        padding: 64px 0;
      }
      .loading-dots {
        display: flex;
        gap: 8px;
      }
      .loading-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--border2);
        animation: bounce 1.2s infinite;
      }
      .loading-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .loading-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.5);
          opacity: 1;
        }
      }

      /* ── MODAL ── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 24px;
        backdrop-filter: blur(6px);
        animation: fadeIn 0.2s ease;
      }
      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 32px;
        width: 100%;
        max-width: 420px;
        box-shadow: var(--shadow-lg);
        animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .modal-title {
        font-family: var(--font-head);
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .modal-text {
        color: var(--text2);
        font-size: 0.88rem;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      /* ── TOAST ── */
      .toast {
        position: fixed;
        bottom: 28px;
        right: 28px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 13px 18px;
        border-radius: 11px;
        font-size: 0.86rem;
        font-weight: 500;
        box-shadow: var(--shadow-lg);
        z-index: 300;
        animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .toast.success::before {
        content: "✓";
        color: var(--success);
        font-weight: 700;
        font-size: 1rem;
      }
      .toast.error::before {
        content: "✕";
        color: var(--error);
        font-weight: 700;
        font-size: 1rem;
      }

      /* ── RESPONSIVE ── */
      @media (max-width: 640px) {
        .navbar {
          padding: 0 18px;
        }
        .app-body {
          padding: 28px 16px;
        }
        .post-card {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- ══════════════════════════════════════
     AUTH PAGE
══════════════════════════════════════ -->
    <div id="auth-page">
      <div class="auth-card">
        <div class="auth-logo">Student<span>Hub</span></div>
        <div class="auth-title">Bienvenue 👋</div>
        <div class="auth-sub">
          Connecte-toi ou crée un compte pour commencer.
        </div>

        <div class="tabs">
          <button class="tab-btn active" onclick="switchAuthTab('login')">
            Connexion
          </button>
          <button class="tab-btn" onclick="switchAuthTab('register')">
            Inscription
          </button>
        </div>

        <!-- LOGIN -->
        <div id="login-form">
          <div class="form-group">
            <label>Email ou username</label>
            <input type="text" id="login-id" placeholder="john@example.com" />
          </div>
          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="login-pw" placeholder="••••••••" />
          </div>
          <button class="btn btn-primary" id="login-btn" onclick="doLogin()">
            Se connecter
          </button>
          <div class="alert alert-error" id="login-error"></div>
        </div>

        <!-- REGISTER -->
        <div id="register-form" class="hidden">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="reg-user" placeholder="johndoe" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="reg-email" placeholder="john@example.com" />
          </div>
          <div class="form-group">
            <label>Mot de passe</label>
            <input
              type="password"
              id="reg-pw"
              placeholder="Min. 6 caractères"
            />
          </div>
          <button
            class="btn btn-primary"
            id="register-btn"
            onclick="doRegister()"
          >
            Créer un compte
          </button>
          <div class="alert alert-error" id="register-error"></div>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════════════
     APP PAGE
══════════════════════════════════════ -->
    <div id="app-page" class="hidden">
      <nav class="navbar">
        <div class="navbar-brand">Student<span>Hub</span></div>
        <div class="navbar-right">
          <div class="navbar-user">
            <div class="navbar-avatar" id="nav-avatar">?</div>
            <span class="navbar-username" id="nav-username">—</span>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="doLogout()">
            Déconnexion
          </button>
        </div>
      </nav>

      <main class="app-body">
        <div class="section-header">
          <div>
            <div class="section-title">Le fil</div>
            <div class="section-count" id="post-count"></div>
          </div>
        </div>

        <!-- CREATE PROMPT -->
        <div
          class="create-prompt"
          onclick="showCreateForm()"
          id="create-prompt"
        >
          <div class="create-prompt-avatar" id="prompt-initial">?</div>
          <div class="create-prompt-text">
            Quoi de neuf ? Publie un article…
          </div>
        </div>

        <!-- POST FORM -->
        <div class="post-form-card hidden" id="post-form-card">
          <div class="post-form-label" id="form-mode-label">Nouveau post</div>
          <div class="form-group">
            <label>Titre</label>
            <input
              type="text"
              id="post-title-input"
              placeholder="Un titre accrocheur…"
            />
          </div>
          <div class="form-group">
            <label>Contenu</label>
            <textarea
              id="post-content-input"
              placeholder="Exprime-toi…"
            ></textarea>
          </div>
          <div class="post-form-actions">
            <button class="btn btn-ghost btn-sm" onclick="hidePostForm()">
              Annuler
            </button>
            <button
              class="btn btn-primary btn-sm"
              id="form-submit-btn"
              onclick="submitPost()"
            >
              Publier
            </button>
          </div>
          <div class="alert alert-error hidden" id="form-error"></div>
        </div>

        <!-- POSTS -->
        <div id="posts-container">
          <div class="posts-loading">
            <div class="loading-dots">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- ══════════════════════════════════════
     DELETE MODAL
══════════════════════════════════════ -->
    <div class="modal-overlay hidden" id="delete-modal">
      <div class="modal">
        <div class="modal-title">Supprimer ce post ?</div>
        <div class="modal-text">
          Cette action est irréversible. Le post sera définitivement supprimé.
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost btn-sm" onclick="closeDeleteModal()">
            Annuler
          </button>
          <button
            class="btn btn-sm"
            id="confirm-delete-btn"
            style="
              background: var(--error);
              color: #fff;
              font-family: var(--font-head);
            "
            onclick="confirmDelete()"
          >
            Supprimer
          </button>
        </div>
      </div>
    </div>

    <script>
      const API = "http://localhost:8080/api";
      let state = {
        token: null,
        user: null,
        posts: [],
        editingPostId: null,
        deletingPostId: null,
      };

      const $ = (id) => document.getElementById(id);

      // ── TOAST ──
      function toast(msg, type = "success") {
        const el = document.createElement("div");
        el.className = `toast ${type}`;
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => {
          el.style.transition = "opacity .3s";
          el.style.opacity = "0";
        }, 2500);
        setTimeout(() => el.remove(), 2800);
      }

      // ── LOADING BUTTON ──
      function setLoading(id, loading, label) {
        const b = $(id);
        b.disabled = loading;
        b.innerHTML = loading
          ? `<span class="spinner"></span> Chargement…`
          : label;
      }

      // ── ALERTS ──
      function showAlert(id, msg) {
        const el = $(id);
        el.textContent = msg;
        el.className = "alert alert-error show";
      }
      function hideAlert(id) {
        const el = $(id);
        if (el) {
          el.textContent = "";
          el.className = "alert alert-error";
        }
      }

      // ── DATE ──
      function formatDate(s) {
        const d = new Date(s),
          diff = (Date.now() - d) / 1000;
        if (diff < 60) return "à l'instant";
        if (diff < 3600) return `il y a ${Math.floor(diff / 60)} min`;
        if (diff < 86400) return `il y a ${Math.floor(diff / 3600)} h`;
        return d.toLocaleDateString("fr-FR", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function initial(u) {
        return (u || "?")[0].toUpperCase();
      }

      // ── AUTH TABS ──
      function switchAuthTab(tab) {
        const login = tab === "login";
        $("login-form").classList.toggle("hidden", !login);
        $("register-form").classList.toggle("hidden", login);
        document
          .querySelectorAll(".tab-btn")
          .forEach((b, i) =>
            b.classList.toggle("active", login ? i === 0 : i === 1),
          );
      }

      // ── LOGIN ──
      async function doLogin() {
        const identifier = $("login-id").value.trim(),
          password = $("login-pw").value;
        hideAlert("login-error");
        if (!identifier || !password) {
          showAlert("login-error", "Remplis tous les champs.");
          return;
        }
        setLoading("login-btn", true, "Se connecter");
        try {
          const res = await fetch(`${API}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ identifier, password }),
          });
          const data = await res.json();
          if (res.ok) onAuthSuccess(data);
          else
            showAlert(
              "login-error",
              data.message || "Identifiants incorrects.",
            );
        } catch {
          showAlert("login-error", "Impossible de contacter l'API.");
        } finally {
          setLoading("login-btn", false, "Se connecter");
        }
      }

      // ── REGISTER ──
      async function doRegister() {
        const username = $("reg-user").value.trim(),
          email = $("reg-email").value.trim(),
          password = $("reg-pw").value;
        hideAlert("register-error");
        if (!username || !email || !password) {
          showAlert("register-error", "Remplis tous les champs.");
          return;
        }
        setLoading("register-btn", true, "Créer un compte");
        try {
          const res = await fetch(`${API}/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password }),
          });
          const data = await res.json();
          if (res.ok) onAuthSuccess(data);
          else {
            const msg = data.errors
              ? Object.values(data.errors).join(" · ")
              : data.message || "Erreur.";
            showAlert("register-error", msg);
          }
        } catch {
          showAlert("register-error", "Impossible de contacter l'API.");
        } finally {
          setLoading("register-btn", false, "Créer un compte");
        }
      }

      // ── AUTH SUCCESS ──
      function onAuthSuccess(data) {
        state.token = data.token;
        state.user = {
          id: data.id,
          username: data.username,
          email: data.email,
          role: data.role,
        };
        $("nav-avatar").textContent = initial(data.username);
        $("nav-username").textContent = data.username;
        $("prompt-initial").textContent = initial(data.username);
        $("prompt-initial").style.background =
          "linear-gradient(135deg,var(--accent),var(--accent2))";
        $("prompt-initial").style.color = "#fff";
        $("auth-page").classList.add("hidden");
        $("app-page").classList.remove("hidden");
        loadPosts();
      }

      // ── LOGOUT ──
      function doLogout() {
        state = {
          token: null,
          user: null,
          posts: [],
          editingPostId: null,
          deletingPostId: null,
        };
        $("app-page").classList.add("hidden");
        $("auth-page").classList.remove("hidden");
        hidePostForm();
        ["login-id", "login-pw", "reg-user", "reg-email", "reg-pw"].forEach(
          (id) => ($(id).value = ""),
        );
        switchAuthTab("login");
      }

      // ── LOAD POSTS ──
      async function loadPosts() {
        $("posts-container").innerHTML =
          `<div class="posts-loading"><div class="loading-dots"><span></span><span></span><span></span></div></div>`;
        try {
          const res = await fetch(`${API}/posts`);
          if (!res.ok) throw new Error();
          state.posts = await res.json();
          renderPosts();
        } catch {
          $("posts-container").innerHTML =
            `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Erreur de chargement</div><div class="empty-text">Impossible de récupérer les posts.</div></div>`;
        }
      }

      // ── RENDER POSTS ──
      function renderPosts() {
        const n = state.posts.length;
        $("post-count").textContent =
          n === 0 ? "Aucun post" : `${n} post${n > 1 ? "s" : ""}`;
        if (n === 0) {
          $("posts-container").innerHTML =
            `<div class="empty-state"><div class="empty-icon">✍️</div><div class="empty-title">Aucun post pour l'instant</div><div class="empty-text">Sois le premier à publier quelque chose !</div></div>`;
          return;
        }
        $("posts-container").innerHTML = state.posts
          .map((post, i) => {
            const own = state.user && post.authorId === state.user.id;
            const delay = Math.min(i * 0.05, 0.4);
            return `
    <div class="post-card" id="post-${post.id}" style="animation-delay:${delay}s">
      <div class="post-header">
        <div class="post-meta">
          <div class="post-avatar ${own ? "own" : ""}">${initial(post.authorUsername)}</div>
          <div>
            <div class="post-author">${esc(post.authorUsername)}${own ? '<span class="own-badge">Moi</span>' : ""}</div>
            <div class="post-date">${formatDate(post.createdAt)}</div>
          </div>
        </div>
        ${
          own
            ? `<div class="post-actions">
          <button class="btn btn-ghost btn-sm" onclick="startEdit(${post.id})">✏️ Modifier</button>
          <button class="btn btn-danger btn-sm" onclick="openDeleteModal(${post.id})">🗑</button>
        </div>`
            : ""
        }
      </div>
      <div class="post-title" onclick="toggleExpand(${post.id})">${esc(post.title)}</div>
      <div class="post-preview" id="preview-${post.id}">${esc(post.content)}</div>
      <div class="post-full hidden" id="full-${post.id}">${esc(post.content)}</div>
      <div class="post-footer">
        <button class="read-more" id="readmore-${post.id}" onclick="toggleExpand(${post.id})">Lire la suite →</button>
        <span class="post-id">ID #${post.id}</span>
      </div>
    </div>`;
          })
          .join("");
      }

      // ── EXPAND ──
      function toggleExpand(id) {
        const p = $(`preview-${id}`),
          f = $(`full-${id}`),
          b = $(`readmore-${id}`);
        const exp = f.classList.contains("hidden");
        p.classList.toggle("hidden", exp);
        f.classList.toggle("hidden", !exp);
        b.textContent = exp ? "← Réduire" : "Lire la suite →";
      }

      // ── CREATE FORM ──
      function showCreateForm() {
        state.editingPostId = null;
        $("form-mode-label").textContent = "Nouveau post";
        $("form-submit-btn").textContent = "Publier";
        $("post-title-input").value = "";
        $("post-content-input").value = "";
        $("create-prompt").classList.add("hidden");
        $("post-form-card").classList.remove("hidden");
        $("post-title-input").focus();
        hideAlert("form-error");
      }
      function hidePostForm() {
        $("post-form-card").classList.add("hidden");
        $("create-prompt").classList.remove("hidden");
        state.editingPostId = null;
      }

      // ── EDIT ──
      function startEdit(id) {
        const post = state.posts.find((p) => p.id === id);
        if (!post) return;
        state.editingPostId = id;
        $("form-mode-label").textContent = "Modifier le post";
        $("form-submit-btn").textContent = "Enregistrer";
        $("post-title-input").value = post.title;
        $("post-content-input").value = post.content;
        $("create-prompt").classList.add("hidden");
        $("post-form-card").classList.remove("hidden");
        $("post-form-card").scrollIntoView({
          behavior: "smooth",
          block: "start",
        });
        $("post-title-input").focus();
        hideAlert("form-error");
      }

      // ── SUBMIT ──
      async function submitPost() {
        const title = $("post-title-input").value.trim(),
          content = $("post-content-input").value.trim();
        hideAlert("form-error");
        if (!title || !content) {
          const el = $("form-error");
          el.textContent = "Le titre et le contenu sont requis.";
          el.className = "alert alert-error show";
          return;
        }
        const isEdit = state.editingPostId !== null;
        const url = isEdit
          ? `${API}/posts/${state.editingPostId}`
          : `${API}/posts`;
        const method = isEdit ? "PUT" : "POST";
        const label = isEdit ? "Enregistrer" : "Publier";
        setLoading("form-submit-btn", true, label);
        try {
          const res = await fetch(url, {
            method,
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${state.token}`,
            },
            body: JSON.stringify({ title, content }),
          });
          const data = await res.json();
          if (res.ok) {
            hidePostForm();
            toast(isEdit ? "Post modifié !" : "Post publié !");
            await loadPosts();
          } else {
            const msg = data.errors
              ? Object.values(data.errors).join(" · ")
              : data.message || "Erreur.";
            const el = $("form-error");
            el.textContent = msg;
            el.className = "alert alert-error show";
          }
        } catch {
          const el = $("form-error");
          el.textContent = "Erreur réseau.";
          el.className = "alert alert-error show";
        } finally {
          setLoading("form-submit-btn", false, label);
        }
      }

      // ── DELETE MODAL ──
      function openDeleteModal(id) {
        state.deletingPostId = id;
        $("delete-modal").classList.remove("hidden");
      }
      function closeDeleteModal() {
        state.deletingPostId = null;
        $("delete-modal").classList.add("hidden");
      }
      async function confirmDelete() {
        const id = state.deletingPostId;
        if (!id) return;
        $("confirm-delete-btn").disabled = true;
        $("confirm-delete-btn").innerHTML = '<span class="spinner"></span>';
        try {
          const res = await fetch(`${API}/posts/${id}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${state.token}` },
          });
          if (res.ok || res.status === 204) {
            closeDeleteModal();
            toast("Post supprimé.");
            await loadPosts();
          } else {
            closeDeleteModal();
            toast("Erreur lors de la suppression.", "error");
          }
        } catch {
          closeDeleteModal();
          toast("Erreur réseau.", "error");
        }
      }

      // ── KEYBOARD ──
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          hidePostForm();
          closeDeleteModal();
        }
        if (
          e.key === "Enter" &&
          !e.shiftKey &&
          !$("auth-page").classList.contains("hidden")
        ) {
          if (!$("login-form").classList.contains("hidden")) doLogin();
          else doRegister();
        }
      });
      $("delete-modal").addEventListener("click", (e) => {
        if (e.target === $("delete-modal")) closeDeleteModal();
      });
    </script>
  </body>
</html>
