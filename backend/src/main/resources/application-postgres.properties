# ══════════════════════════════════════════════════════════════
# StudentHub - Profil PostgreSQL (Windows/Production)
# ══════════════════════════════════════════════════════════════
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# OU: $env:SPRING_PROFILES_ACTIVE="postgres"; mvn spring-boot:run
# ══════════════════════════════════════════════════════════════

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://postgres:5432/studenthub
spring.datasource.username=studenthub_user0
spring.datasource.password=studenthub123

# JPA/Hibernate pour PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update