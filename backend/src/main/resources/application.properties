# # ========================================
# # Configuration de l'application StudentHub
# # ========================================

# # Nom de l'application
# spring.application.name=StudentHub

# # Port du serveur (par défaut 8080)
# server.port=8080

# # ========================================
# # Configuration de la base de données PostgreSQL
# # ========================================

# # URL de connexion à la base de données
# # Format: jdbc:postgresql://host:port/nom_de_la_base
# spring.datasource.url=jdbc:postgresql://localhost:5432/studenthub

# # Nom d'utilisateur PostgreSQL
# # spring.datasource.username=postgres

# # Mot de passe PostgreSQL (à changer avec ton mot de passe)
# # spring.datasource.password=postgres

# spring.datasource.username=studenthub_user0
# spring.datasource.password=studenthub123

# # Driver PostgreSQL
# spring.datasource.driver-class-name=org.postgresql.Driver

# # ========================================
# # Configuration JPA/Hibernate
# # ========================================

# # Dialecte PostgreSQL pour Hibernate
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# # Stratégie de génération du schéma
# # - create: supprime et recrée les tables à chaque démarrage (DANGER en prod!)
# # - create-drop: comme create, mais supprime tout à l'arrêt
# # - update: met à jour le schéma sans supprimer les données (recommandé en dev)
# # - validate: vérifie que le schéma correspond aux entités (recommandé en prod)
# # - none: ne fait rien
# spring.jpa.hibernate.ddl-auto=update

# # Afficher les requêtes SQL dans la console (utile pour apprendre)
# spring.jpa.show-sql=true

# # Formatter les requêtes SQL pour qu'elles soient lisibles
# spring.jpa.properties.hibernate.format_sql=true

# # Afficher les paramètres des requêtes SQL
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# # ========================================
# # Configuration JWT (on va définir ça plus tard)
# # ========================================

# # Clé secrète pour signer les tokens JWT (CHANGE CETTE VALEUR!)
# # Tu peux générer une clé aléatoire avec: openssl rand -base64 64
# jwt.secret=VoiciUneCleSecreteTresLonguePourSignerLesTokensJWTChangeMoiEnProduction123456789

# # Durée de validité du token en millisecondes (24 heures = 86400000 ms)
# jwt.expiration=86400000

# # ========================================
# # Configuration CORS (pour le frontend)
# # ========================================

# # Origines autorisées (Angular sur localhost:4200)
# cors.allowed-origins=http://localhost:4200,http://localhost:3000

# # ========================================
# # Configuration des logs
# # ========================================

# # Niveau de log pour l'application
# logging.level.io.aotchoun.blog=DEBUG

# # Niveau de log pour Spring
# logging.level.org.springframework.web=INFO

# # Niveau de log pour Hibernate
# logging.level.org.hibernate=INFO

# # ========================================
# # Configuration de l'upload de fichiers
# # ========================================

# # Taille maximale d'un fichier (10MB)
# spring.servlet.multipart.max-file-size=10MB

# # Taille maximale d'une requête (10MB)
# spring.servlet.multipart.max-request-size=10MB

# # ========================================
# # Configuration du serveur
# # ========================================

# # Encoder les réponses en UTF-8
# server.servlet.encoding.charset=UTF-8
# server.servlet.encoding.enabled=true
# server.servlet.encoding.force=true

# # Format des dates JSON
# spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
# spring.jackson.time-zone=UTC






